# ChainPulse configuration — copy to config.toml and edit.
# Secrets (RPC keys, DB DSNs) live in .env — referenced here as ${VAR}.

[app]
log_level = "info"          # debug | info | warn | error
metrics_addr = ":9100"      # Prometheus scrape endpoint

[kafka]
brokers = ["localhost:9092"]
topic_raw_events = "raw_events"
topic_decoded_events = "decoded_events"
topic_positions_update = "positions_update"
client_id = "chainpulse"

[clickhouse]
# native protocol DSN, e.g. clickhouse://default:@localhost:9000/chainpulse
dsn            = "${CLICKHOUSE_DSN}"
database       = "chainpulse"
batch_size     = 1000        # flush after N rows
batch_interval = "1s"        # flush at least every N (Go duration)

[redis]
addr        = "${REDIS_ADDR}"
password    = ""
db          = 0
default_ttl = "60s"          # cache TTL for wallet positions / balances

[processor]
consumer_group = "chainpulse-processor"
max_in_flight  = 256

# One [[chains]] block per chain. Day 1 = Base only.
[[chains]]
chain_id      = 8453
name          = "base"
rpc_wss       = "${BASE_WSS_URL}"
rpc_http      = "${BASE_HTTP_URL}"
start_block   = 0           # 0 = start from latest head
confirmations = 2           # blocks to wait before processing (reorg safety)
# Optional: monitored contract whitelist. Empty = all contracts.
contracts     = []
