# ChainPulse configuration — copy to config.toml and edit.
# Secrets (RPC keys, DB DSNs) live in .env — referenced here as ${VAR}.

[app]
log_level        = "info"     # debug | info | warn | error
metrics_addr     = ":9100"    # Prometheus scrape endpoint
health_addr      = ":9180"    # /health endpoint for liveness probes (set "" to disable)
shutdown_timeout = "30s"      # max time to drain in-flight work on SIGINT/SIGTERM

[kafka]
brokers = ["localhost:9092"]
topic_raw_events = "raw_events"
topic_decoded_events = "decoded_events"
topic_positions_update = "positions_update"
client_id = "chainpulse"

[clickhouse]
# native protocol DSN, e.g. clickhouse://default:@localhost:9000/chainpulse
dsn            = "${CLICKHOUSE_DSN}"
database       = "chainpulse"
batch_size     = 1000        # flush after N rows
batch_interval = "1s"        # flush at least every N (Go duration)

[redis]
addr        = "${REDIS_ADDR}"
password    = ""
db          = 0
default_ttl = "60s"          # cache TTL for wallet positions / balances

[processor]
consumer_group = "chainpulse-processor"
max_in_flight  = 256

[api]
addr            = ":8080"     # Gin REST listener
grpc_addr       = ":8081"     # gRPC listener
request_timeout = "10s"       # per-request handler timeout
shutdown_drain  = "15s"       # graceful shutdown drain window

[api.cors]
allowed_origins   = ["*"]      # exact origins or "*"
allow_credentials = false      # set true only with explicit origins

[api.rate_limit]
per_ip_per_minute = 100        # 0 disables; tested in production with 100
burst             = 20

[api.websocket]
read_buffer_bytes  = 4096
write_buffer_bytes = 4096
origin_check       = "strict"  # "strict" | "permissive"

[mcp]
addr         = ":3001"           # SSE transport listener (ignored when transport = stdio)
transport    = "sse"             # "stdio" | "sse" — stdio = Claude Desktop, sse = HTTP agents
cache_ttl    = "60s"              # Redis TTL for tool-call results
bearer_token = "${MCP_BEARER_TOKEN}"  # empty = SSE runs unauthenticated; set when exposed

# One [[chains]] block per chain. Comment out blocks you don't need.
# `confirmations` is the reorg-safety window — set higher on chains with
# probabilistic finality (PoS Polygon) or known reorg patterns (BSC).
# `start_block = 0` means "start from latest head."

[[chains]]
chain_id      = 8453
name          = "base"
rpc_wss       = "${BASE_WSS_URL}"
rpc_http      = "${BASE_HTTP_URL}"
start_block   = 0
confirmations = 2
contracts     = []  # empty = all contracts; pass an allowlist to scope

