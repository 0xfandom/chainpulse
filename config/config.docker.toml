# Compose-targeted config. Hostnames resolve via docker network DNS.
# Secrets injected through .env (loaded by each service via env_file).

[app]
log_level                    = "info"
metrics_addr                 = "${METRICS_ADDR}"  # set per service via compose environment
health_addr                  = ":9180"
shutdown_timeout             = "30s"
readiness_head_timeout       = "60s"  # indexer-only: /ready flips to 503 if any chain head older than this
kafka_publish_fail_threshold = 5      # indexer-only: exit non-zero after N consecutive blocks with kafka publish failures
chain_dial_stagger           = "1s"   # indexer-only: stagger initial WSS dials by N*1s; protects free-tier RPCs from 429 burst on 9-chain default

[kafka]
brokers                = ["kafka:9092"]
topic_raw_events       = "raw_events"
topic_decoded_events   = "decoded_events"
topic_positions_update = "positions_update"
client_id              = "chainpulse"

[clickhouse]
dsn            = "clickhouse://default:@clickhouse:9000/chainpulse"
database       = "chainpulse"
batch_size     = 1000
batch_interval = "250ms"

[redis]
addr        = "redis:6379"
password    = ""
db          = 0
default_ttl = "60s"

[processor]
consumer_group = "chainpulse-processor"
max_in_flight  = 256

[api]
addr            = ":8080"
grpc_addr       = ":8081"
request_timeout = "10s"
shutdown_drain  = "15s"

[api.cors]
allowed_origins   = ["*"]
allow_credentials = false

[api.rate_limit]
per_ip_per_minute = 100
burst             = 20

[api.websocket]
read_buffer_bytes  = 4096
write_buffer_bytes = 4096
origin_check       = "permissive"

[mcp]
addr         = ":3001"
transport    = "sse"
cache_ttl    = "60s"
bearer_token = "${MCP_BEARER_TOKEN}"  # set in .env (empty string allowed)

[[chains]]
chain_id      = 1
name          = "ethereum"
rpc_wss       = "${ETH_WSS_URL}"
rpc_http      = "${ETH_HTTP_URL}"
start_block   = 0
confirmations = 4
contracts     = []

[[chains]]
chain_id      = 42161
name          = "arbitrum"
rpc_wss       = "${ARB_WSS_URL}"
rpc_http      = "${ARB_HTTP_URL}"
start_block   = 0
confirmations = 1
contracts     = []

[[chains]]
chain_id      = 137
name          = "polygon"
rpc_wss       = "${POLY_WSS_URL}"
rpc_http      = "${POLY_HTTP_URL}"
start_block   = 0
confirmations = 32
contracts     = []
