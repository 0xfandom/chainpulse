name: CI

on:
  push:
    branches: ["**"]
    paths-ignore:
      - 'web/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'web/**'
      - '**/*.md'

permissions:
  contents: read

jobs:
  lint-build-test:
    name: lint, build, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          check-latest: true
          cache: true

      - name: Verify modules
        run: go mod download

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt issues in:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./... -race -count=1
