services:
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: chainpulse-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: chainpulse-kraft-cluster
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: chainpulse-clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: chainpulse
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./schema:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: chainpulse-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  indexer:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: indexer
      args:
        VERSION: ${VERSION:-dev}
    image: chainpulse/indexer:${VERSION:-dev}
    container_name: chainpulse-indexer
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./config/config.docker.toml:/etc/chainpulse/config.toml:ro
    expose:
      - "9100"

  processor:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: processor
      args:
        VERSION: ${VERSION:-dev}
    image: chainpulse/processor:${VERSION:-dev}
    container_name: chainpulse-processor
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./config/config.docker.toml:/etc/chainpulse/config.toml:ro
    expose:
      - "9101"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
      args:
        VERSION: ${VERSION:-dev}
    image: chainpulse/api:${VERSION:-dev}
    container_name: chainpulse-api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "8081:8081"
    expose:
      - "9102"
    volumes:
      - ./config/config.docker.toml:/etc/chainpulse/config.toml:ro

  mcp:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: mcp
      args:
        VERSION: ${VERSION:-dev}
    image: chainpulse/mcp:${VERSION:-dev}
    container_name: chainpulse-mcp
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3001:3001"
    expose:
      - "9103"
    volumes:
      - ./config/config.docker.toml:/etc/chainpulse/config.toml:ro

volumes:
  kafka_data:
  clickhouse_data:
  redis_data:
