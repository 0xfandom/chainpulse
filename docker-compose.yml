services:
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: chainpulse-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Dual listener: INSIDE for in-compose services (advertises kafka:9092),
      # OUTSIDE for host clients (advertises localhost:29092).
      KAFKA_LISTENERS: INSIDE://0.0.0.0:9092,OUTSIDE://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:9092,OUTSIDE://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: 8DPCwHmgQXy9rQZjQHyAtw
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: chainpulse-clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: chainpulse
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./schema:/docker-entrypoint-initdb.d:ro
      - ./docker/clickhouse/lite-memory.xml:/etc/clickhouse-server/config.d/lite-memory.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: chainpulse-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--save"
      - "60"
      - "1"
      - "--maxmemory"
      - "64mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  indexer:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: indexer
      args:
        VERSION: ${VERSION:-dev}
    image: chainpulse/indexer:${VERSION:-dev}
    container_name: chainpulse-indexer
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      METRICS_ADDR: ":9100"
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./config/config.docker.toml:/etc/chainpulse/config.toml:ro
    expose:
      - "9100"

  processor:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: processor
      args:
        VERSION: ${VERSION:-dev}
    image: chainpulse/processor:${VERSION:-dev}
    container_name: chainpulse-processor
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      METRICS_ADDR: ":9101"
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./config/config.docker.toml:/etc/chainpulse/config.toml:ro
    expose:
      - "9101"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
      args:
        VERSION: ${VERSION:-dev}
    image: chainpulse/api:${VERSION:-dev}
    container_name: chainpulse-api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      METRICS_ADDR: ":9102"
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "8081:8081"
    expose:
      - "9102"
    volumes:
      - ./config/config.docker.toml:/etc/chainpulse/config.toml:ro

  mcp:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: mcp
      args:
        VERSION: ${VERSION:-dev}
    image: chainpulse/mcp:${VERSION:-dev}
    container_name: chainpulse-mcp
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      METRICS_ADDR: ":9103"
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3011:3001"
    expose:
      - "9103"
    volumes:
      - ./config/config.docker.toml:/etc/chainpulse/config.toml:ro

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: chainpulse-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    depends_on:
      indexer:
        condition: service_started
      processor:
        condition: service_started
      api:
        condition: service_started
      mcp:
        condition: service_started

  grafana:
    image: grafana/grafana:11.2.0
    container_name: chainpulse-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started

volumes:
  kafka_data:
  clickhouse_data:
  redis_data:
  prometheus_data:
  grafana_data:
